# Every value can be overridden with the environment variable on its left ("$VAR:default").
# The defaults point to the local services in docker-compose.yml, so `./gradlew run` works
# after `docker compose up -d` with no extra setup. Production sets every variable.
ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - manoellribeiro.dev.ApplicationKt.module

database:
  url: "$DATABASE_URL:jdbc:postgresql://localhost:5432/martp"
  user: "$DATABASE_USER:martp"
  password: "$DATABASE_PASSWORD:martp"
  maxPoolSize: "$DATABASE_MAX_POOL_SIZE:5"

storage:
  # Cloudflare R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com, region "auto", forcePathStyle false
  endpoint: "$STORAGE_ENDPOINT:http://localhost:9000"
  region: "$STORAGE_REGION:auto"
  bucket: "$STORAGE_BUCKET:map-arts"
  accessKey: "$STORAGE_ACCESS_KEY:martp-local"
  secretKey: "$STORAGE_SECRET_KEY:martp-local-secret"
  forcePathStyle: "$STORAGE_FORCE_PATH_STYLE:true"
  # Public URL the exhibition loads images from: <publicBaseUrl>/<imageKey>
  publicBaseUrl: "$STORAGE_PUBLIC_BASE_URL:http://localhost:9000/map-arts"

geocoding:
  baseUrl: "$GEOCODING_BASE_URL:https://nominatim.openstreetmap.org"
  # Nominatim's usage policy requires a User-Agent that identifies the application
  userAgent: "$GEOCODING_USER_AGENT:martp-api (https://github.com/manoellribeiro/map-arts)"

appCheck:
  # Firebase App Check (Play Integrity on Android, reCAPTCHA on the web). Not secrets: both are
  # public in the apps (google-services.json). Defaults are the Martp Firebase project.
  # The project number is in Firebase console > Project settings, the app IDs too (one per app).
  projectNumber: "$FIREBASE_PROJECT_NUMBER:814915753343"
  # Comma-separated Firebase App IDs allowed to call the API (Android app, web app, exhibition)
  allowedAppIds: "$FIREBASE_ALLOWED_APP_IDS:1:814915753343:android:c0fb0c5fd419082eedf64a,1:814915753343:web:93312f94d4f50ed3edf64a"
  jwksUrl: "$FIREBASE_APP_CHECK_JWKS_URL:https://firebaseappcheck.googleapis.com/v1/jwks"

cors:
  # Comma-separated origins of the web app (scheme://host[:port])
  allowedOrigins: "$CORS_ALLOWED_ORIGINS:https://martp.app,https://manoellribeiro.github.io,http://localhost:5173"
